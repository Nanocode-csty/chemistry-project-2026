databases:
  - name: labcam-db
    databaseName: escuelaiq
    user: postgres
    plan: free

services:
  - type: web
    name: labcam-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labcam-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: ADMIN_EMAIL
        value: admin@escuela-iq.edu
      - key: ADMIN_PASSWORD
        value: admin123

  - type: web
    name: labcam-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: /api
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: labcam-backend
          property: hostport
